<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title description">
  <title id="title">Advantage 360 Navigation layer</title>
  <desc id="description">Navigation layer with Vim-style H J K L directions, navigation hold-taps, sticky modifiers on the left home row, and Cancel on the right outer thumb.</desc>
  <style>.bg{fill:#101827}.half{fill:#172235;stroke:#334155;stroke-width:2}.active{fill:#24354d;stroke:#4c6788;stroke-width:2}.mod{fill:#4c1d95;stroke:#a78bfa;stroke-width:2}.thumb{fill:#164e63;stroke:#22d3ee;stroke-width:2}.title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.sub{fill:#94a3b8;font:16px system-ui,sans-serif}.key{fill:#f8fafc;font:700 15px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e0f2fe;font:12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.note{fill:#94a3b8;font:14px system-ui,sans-serif;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="490" rx="24"/><text class="title" x="600" y="50" text-anchor="middle">Navigation Layer</text><text class="sub" x="600" y="78" text-anchor="middle">Hold Space. H/J/K/L: Left/Down/Up/Right. Purple keys are one-shot modifiers.</text>
  <rect class="half" x="55" y="110" width="500" height="285" rx="22"/><rect class="half" x="645" y="110" width="500" height="285" rx="22"/>
  <g class="mod"><rect x="90" y="205" width="74" height="58" rx="10"/><rect x="175" y="205" width="74" height="58" rx="10"/><rect x="260" y="205" width="74" height="58" rx="10"/><rect x="345" y="205" width="74" height="58" rx="10"/></g>
  <text class="key" x="127" y="234">GUI</text><text class="key" x="212" y="234">ALT</text><text class="key" x="297" y="234">CTRL</text><text class="key" x="382" y="234">SHIFT</text>
  <g class="active"><rect x="685" y="135" width="74" height="58" rx="10"/><rect x="770" y="135" width="74" height="58" rx="10"/><rect x="855" y="135" width="74" height="58" rx="10"/><rect x="940" y="135" width="74" height="58" rx="10"/><rect x="1025" y="135" width="74" height="58" rx="10"/><rect x="685" y="205" width="74" height="58" rx="10"/><rect x="770" y="205" width="74" height="58" rx="10"/><rect x="855" y="205" width="74" height="58" rx="10"/><rect x="940" y="205" width="74" height="58" rx="10"/><rect x="1025" y="205" width="74" height="58" rx="10"/><rect x="685" y="275" width="74" height="58" rx="10"/><rect x="770" y="275" width="74" height="58" rx="10"/><rect x="855" y="275" width="74" height="58" rx="10"/><rect x="940" y="275" width="74" height="58" rx="10"/></g>
  <text class="key" x="807" y="164">BSPC</text><text class="key" x="892" y="164">ENTER</text><text class="key" x="977" y="164">DEL</text><text class="key" x="1062" y="164">PG UP</text><text class="key" x="722" y="234">LEFT</text><text class="key" x="807" y="234">DOWN</text><text class="key" x="892" y="234">UP</text><text class="key" x="977" y="234">RIGHT</text><text class="key" x="1062" y="234">PG DN</text><text class="key" x="722" y="304">INS</text><text class="key" x="807" y="304">TAB</text><text class="key" x="892" y="304">ESC</text><text class="small" x="977" y="304">CAPS WORD</text>
  <rect class="thumb" x="260" y="320" width="118" height="58" rx="12"/><text class="small" x="319" y="349">SPACE / NAV</text><rect class="thumb" x="822" y="320" width="118" height="58" rx="12"/><text class="small" x="881" y="349">NUMBER</text><rect class="thumb" x="944" y="320" width="118" height="58" rx="12"/><text class="small" x="1003" y="349">CANCEL</text>
  <text class="note" x="600" y="440">Hold H/J/K/L: Home/Ctrl+End/Ctrl+Home/End. Hold U/O: Ctrl+Backspace/Ctrl+Delete. Cancel clears sticky state.</text>
</svg>
