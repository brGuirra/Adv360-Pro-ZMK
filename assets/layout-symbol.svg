<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title description">
  <title id="title">Advantage 360 Symbol layer</title>
  <desc id="description">Symbol layer with coding punctuation distributed across both halves and a Symbol thumb that cancels to Base.</desc>
  <style>.bg{fill:#101827}.half{fill:#172235;stroke:#334155;stroke-width:2}.keybox{fill:#24354d;stroke:#4c6788;stroke-width:2}.thumb{fill:#164e63;stroke:#22d3ee;stroke-width:2}.title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.sub{fill:#94a3b8;font:16px system-ui,sans-serif}.key{fill:#f8fafc;font:700 18px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e0f2fe;font:12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.note{fill:#94a3b8;font:14px system-ui,sans-serif;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="490" rx="24"/><text class="title" x="600" y="50" text-anchor="middle">Symbol Layer</text><text class="sub" x="600" y="78" text-anchor="middle">Tap once for one-shot Symbol, hold for Symbol, or tap then hold to lock it.</text>
  <rect class="half" x="55" y="110" width="500" height="285" rx="22"/><rect class="half" x="645" y="110" width="500" height="285" rx="22"/>
  <g class="keybox"><rect x="90" y="135" width="74" height="58" rx="10"/><rect x="175" y="135" width="74" height="58" rx="10"/><rect x="260" y="135" width="74" height="58" rx="10"/><rect x="345" y="135" width="74" height="58" rx="10"/><rect x="430" y="135" width="74" height="58" rx="10"/><rect x="90" y="205" width="74" height="58" rx="10"/><rect x="175" y="205" width="74" height="58" rx="10"/><rect x="260" y="205" width="74" height="58" rx="10"/><rect x="345" y="205" width="74" height="58" rx="10"/><rect x="430" y="205" width="74" height="58" rx="10"/><rect x="90" y="275" width="74" height="58" rx="10"/><rect x="175" y="275" width="74" height="58" rx="10"/><rect x="260" y="275" width="74" height="58" rx="10"/><rect x="345" y="275" width="74" height="58" rx="10"/><rect x="430" y="275" width="74" height="58" rx="10"/></g>
  <text class="key" x="127" y="164">`</text><text class="key" x="212" y="164">&lt;</text><text class="key" x="297" y="164">[</text><text class="key" x="382" y="164">{</text><text class="key" x="467" y="164">(</text><text class="key" x="127" y="234">!</text><text class="key" x="212" y="234">@</text><text class="key" x="297" y="234">#</text><text class="key" x="382" y="234">$</text><text class="key" x="467" y="234">%</text><text class="key" x="127" y="304">~</text><text class="key" x="212" y="304">\</text><text class="key" x="297" y="304">/</text><text class="key" x="382" y="304">*</text><text class="key" x="467" y="304">_</text>
  <g class="keybox"><rect x="685" y="135" width="74" height="58" rx="10"/><rect x="770" y="135" width="74" height="58" rx="10"/><rect x="855" y="135" width="74" height="58" rx="10"/><rect x="940" y="135" width="74" height="58" rx="10"/><rect x="1025" y="135" width="74" height="58" rx="10"/><rect x="685" y="205" width="74" height="58" rx="10"/><rect x="770" y="205" width="74" height="58" rx="10"/><rect x="855" y="205" width="74" height="58" rx="10"/><rect x="940" y="205" width="74" height="58" rx="10"/><rect x="1025" y="205" width="74" height="58" rx="10"/><rect x="685" y="275" width="74" height="58" rx="10"/><rect x="770" y="275" width="74" height="58" rx="10"/><rect x="855" y="275" width="74" height="58" rx="10"/><rect x="940" y="275" width="74" height="58" rx="10"/><rect x="1025" y="275" width="74" height="58" rx="10"/></g>
  <text class="key" x="722" y="164">)</text><text class="key" x="807" y="164">}</text><text class="key" x="892" y="164">]</text><text class="key" x="977" y="164">&gt;</text><text class="key" x="1062" y="164">^</text><text class="key" x="722" y="234">&amp;</text><text class="key" x="807" y="234">-</text><text class="key" x="892" y="234">+</text><text class="key" x="977" y="234">=</text><text class="key" x="1062" y="234">|</text><text class="key" x="722" y="304">?</text><text class="key" x="807" y="304">:</text><text class="key" x="892" y="304">;</text><text class="key" x="977" y="304">'</text><text class="key" x="1062" y="304">&quot;</text>
  <rect class="thumb" x="380" y="320" width="118" height="58" rx="12"/><text class="small" x="439" y="349">SYMBOL: BASE</text><text class="note" x="600" y="440">The Symbol thumb cancels the locked layer; the other active thumbs are transparent.</text>
</svg>
