<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title description">
  <title id="title">Advantage 360 Utility layer</title>
  <desc id="description">Utility layer activated by holding Symbol and Number together, containing function, Bluetooth, media, bootloader, and lighting controls.</desc>
  <style>.bg{fill:#101827}.half{fill:#172235;stroke:#334155;stroke-width:2}.keybox{fill:#24354d;stroke:#4c6788;stroke-width:2}.system{fill:#4c1d95;stroke:#a78bfa;stroke-width:2}.thumb{fill:#164e63;stroke:#22d3ee;stroke-width:2}.title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.sub{fill:#94a3b8;font:16px system-ui,sans-serif}.key{fill:#f8fafc;font:700 15px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e0f2fe;font:12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.note{fill:#94a3b8;font:14px system-ui,sans-serif;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="490" rx="24"/><text class="title" x="600" y="50" text-anchor="middle">Utility Layer</text><text class="sub" x="600" y="78" text-anchor="middle">Hold Symbol and Number together for functions, Bluetooth, media, and device controls.</text>
