<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title description">
  <title id="title">Advantage 360 Number layer</title>
  <desc id="description">Number layer with numpad on the left, symbols on the right, and the Number thumb cancelling to Base.</desc>
  <style>.bg{fill:#101827}.half{fill:#172235;stroke:#334155;stroke-width:2}.keybox{fill:#24354d;stroke:#4c6788;stroke-width:2}.trans{fill:#1e293b;stroke:#64748b;stroke-width:2;stroke-dasharray:5 4}.thumb{fill:#164e63;stroke:#22d3ee;stroke-width:2}.cancel{fill:#7c2d12;stroke:#fb923c;stroke-width:2}.title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.sub{fill:#94a3b8;font:16px system-ui,sans-serif}.key{fill:#f8fafc;font:700 17px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e0f2fe;font:12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.note{fill:#94a3b8;font:14px system-ui,sans-serif;text-anchor:middle}</style>
  <rect class="bg" width="1200" height="490" rx="24"/><text class="title" x="600" y="50" text-anchor="middle">Number Layer</text><text class="sub" x="600" y="78" text-anchor="middle">Tap once for one-shot Number, hold for Number, or tap then hold to lock it.</text>
  <rect class="half" x="55" y="110" width="500" height="285" rx="22"/><rect class="half" x="645" y="110" width="500" height="285" rx="22"/>
  <g class="trans"><rect x="90" y="135" width="74" height="58" rx="10"/><rect x="430" y="135" width="74" height="58" rx="10"/><rect x="430" y="205" width="74" height="58" rx="10"/><rect x="90" y="275" width="74" height="58" rx="10"/><rect x="430" y="275" width="74" height="58" rx="10"/></g><g class="keybox"><rect x="175" y="135" width="74" height="58" rx="10"/><rect x="260" y="135" width="74" height="58" rx="10"/><rect x="345" y="135" width="74" height="58" rx="10"/><rect x="90" y="205" width="74" height="58" rx="10"/><rect x="175" y="205" width="74" height="58" rx="10"/><rect x="260" y="205" width="74" height="58" rx="10"/><rect x="345" y="205" width="74" height="58" rx="10"/><rect x="175" y="275" width="74" height="58" rx="10"/><rect x="260" y="275" width="74" height="58" rx="10"/><rect x="345" y="275" width="74" height="58" rx="10"/></g>
  <text class="small" x="127" y="164">BASE</text><text class="key" x="212" y="164">7</text><text class="key" x="297" y="164">8</text><text class="key" x="382" y="164">9</text><text class="small" x="467" y="164">BASE</text><text class="key" x="127" y="234">0</text><text class="key" x="212" y="234">4</text><text class="key" x="297" y="234">5</text><text class="key" x="382" y="234">6</text><text class="small" x="467" y="234">BASE</text><text class="small" x="127" y="304">BASE</text><text class="key" x="212" y="304">1</text><text class="key" x="297" y="304">2</text><text class="key" x="382" y="304">3</text><text class="small" x="467" y="304">BASE</text>
  <g class="keybox"><rect x="685" y="135" width="74" height="58" rx="10"/><rect x="770" y="135" width="74" height="58" rx="10"/><rect x="855" y="135" width="74" height="58" rx="10"/><rect x="940" y="135" width="74" height="58" rx="10"/><rect x="1025" y="135" width="74" height="58" rx="10"/><rect x="685" y="205" width="74" height="58" rx="10"/><rect x="770" y="205" width="74" height="58" rx="10"/><rect x="855" y="205" width="74" height="58" rx="10"/><rect x="940" y="205" width="74" height="58" rx="10"/><rect x="1025" y="205" width="74" height="58" rx="10"/><rect x="685" y="275" width="74" height="58" rx="10"/><rect x="770" y="275" width="74" height="58" rx="10"/><rect x="855" y="275" width="74" height="58" rx="10"/><rect x="940" y="275" width="74" height="58" rx="10"/><rect x="1025" y="275" width="74" height="58" rx="10"/></g>
  <text class="key" x="722" y="164">[</text><text class="key" x="807" y="164">]</text><text class="key" x="892" y="164">/</text><text class="key" x="977" y="164">*</text><text class="key" x="1062" y="164">%</text><text class="key" x="722" y="234">(</text><text class="key" x="807" y="234">)</text><text class="key" x="892" y="234">-</text><text class="key" x="977" y="234">+</text><text class="key" x="1062" y="234">=</text><text class="key" x="722" y="304">&lt;</text><text class="key" x="807" y="304">&gt;</text><text class="key" x="892" y="304">,</text><text class="key" x="977" y="304">.</text><text class="key" x="1062" y="304">:</text>
  <rect class="cancel" x="678" y="320" width="126" height="58" rx="12"/><text class="small" x="741" y="349">NUMBER: BASE</text><text class="note" x="600" y="440">Dashed keys are transparent and fall through to Base. The Number thumb cancels the locked layer.</text>
</svg>
